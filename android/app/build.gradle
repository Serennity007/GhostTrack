plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.serennity.ghosttrack'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.serennity.ghosttrack'
        minSdk 24
        targetSdk 36
        versionCode 16000
        versionName '1.6.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            if (System.getenv('GHOSTTRACK_KEYSTORE')) {
                storeFile file(System.getenv('GHOSTTRACK_KEYSTORE'))
                storePassword System.getenv('GHOSTTRACK_STORE_PASSWORD')
                keyAlias 'ghosttrack'
                keyPassword System.getenv('GHOSTTRACK_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Share service dependencies, without importing Tkinter or desktop UI state.
    sourceSets { main { assets.srcDir '../../docs/android-assets' } }
}

chaquopy {
    defaultConfig {
        version '3.11'
        if (System.getenv('GHOSTTRACK_BUILD_PYTHON')) {
            buildPython System.getenv('GHOSTTRACK_BUILD_PYTHON')
        }
        pip { install '-r', '../../requirements.txt' }
    }
    sourceSets {
        main { srcDir layout.buildDirectory.dir('generated/shared-python') }
    }
}

tasks.register('syncSharedPython', Sync) {
    def releaseVersion = android.defaultConfig.versionName
    inputs.property('androidVersionName', releaseVersion)
    from('../..') {
        include 'queries.py', 'platforms.py', 'public_data.py', 'i18n.py', 'reports.py', 'archive.py'
    }
    into layout.buildDirectory.dir('generated/shared-python')
    doLast {
        if (releaseVersion.length() > 32 ||
                !(releaseVersion ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/)) {
            throw new GradleException('Android versionName must be numeric major.minor.patch.')
        }
        // Windows and Android releases have independent versions.
        new File(destinationDir, 'version.py').setText("VERSION = '${releaseVersion}'\n", 'UTF-8')
    }
}
tasks.configureEach {
    if (name.endsWith('PythonSources') && (name.startsWith('merge') || name.startsWith('generate'))) {
        dependsOn tasks.named('syncSharedPython')
    }
}
