name: Windows desktop build
on:
  push:
    branches: [main, codex/windows-desktop]
    tags: ['windows-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build
        run: python build_windows.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GhostTrack-Windows-x64
          path: |
            dist/GhostTrack-v*-Windows-x64.zip
            dist/SHA256SUMS-v*.txt
